name: Asset validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: asset-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-raster-validation:
    name: Linux / Python SVG raster validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install the rasterizer used by the shipping check
        run: >-
          sudo apt-get update &&
          sudo apt-get install --no-install-recommends -y imagemagick librsvg2-bin
      - name: Run authoring and target-size checks
        run: |
          python tools/draw_devices.py --check
          python tools/draw_keyboard.py --check
          python tools/draw_touch_controls.py --check
          python tools/draw_xbox360.py --check
          python tests/test_sets.py
